# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: usdc
description: ERC-20 Transfer events and running holder balances (HyperIndex port of indexers/usdc)
# Rows are keyed by (id, chainId), so entity ids match the squid's ids exactly.
disable_default_cross_chain: true
field_selection:
  transaction_fields: [hash]
chains:
  - id: 143
    # Same switches as the squid's .env: CONTRACT_ADDRESS and START_BLOCK.
    start_block: ${ENVIO_START_BLOCK:-0}
    contracts:
      - name: ERC20
        address:
          - "${ENVIO_CONTRACT_ADDRESS}"
        events:
          - event: Transfer(address indexed from, address indexed to, uint256 value)
