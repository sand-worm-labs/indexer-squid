# One Postgres shared by every squid. Each squid gets its own database (see ./squids).
name: squids
services:
  db:
    image: postgres:15
    restart: unless-stopped
    # Tuned for bulk indexing. synchronous_commit=off can lose the last few commits on a crash; squids just reprocess them.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: ${SANDWORM_CLOUD_DB_USER:?set SANDWORM_CLOUD_DB_USER in ./.env}
      POSTGRES_PASSWORD: ${SANDWORM_CLOUD_DB_PASSWORD:?set SANDWORM_CLOUD_DB_PASSWORD in ./.env}
      POSTGRES_DB: ${SANDWORM_CLOUD_DB_NAME:-sandworm_cloud_db}
    ports:
      - "127.0.0.1:${SANDWORM_CLOUD_DB_PORT:-23798}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 1gb
  ui:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SANDWORM_CLOUD_UI_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
  # Runs every enabled squid (processor + GraphQL API) under pm2. Start with: docker compose up -d --build squids
  # Don't also run a squid with ./squids start: two processors on one schema corrupt it. Exclude it via ENABLED_SQUIDS.
  squids:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SANDWORM_CLOUD_DB_USER: ${SANDWORM_CLOUD_DB_USER}
      SANDWORM_CLOUD_DB_PASSWORD: ${SANDWORM_CLOUD_DB_PASSWORD}
      SANDWORM_CLOUD_DB_NAME: ${SANDWORM_CLOUD_DB_NAME:-sandworm_cloud_db}
      ENABLED_SQUIDS: ${ENABLED_SQUIDS:-}
    volumes:
      - ./perpl/.env:/app/perpl/.env:ro
      - ./usdc/.env:/app/usdc/.env:ro
      - ./paj/.env:/app/paj/.env:ro
    ports:
      - "127.0.0.1:4350-4355:4350-4355"
volumes:
  pgdata:
